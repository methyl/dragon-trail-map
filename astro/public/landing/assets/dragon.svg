<title id="title">Smok z pieczęci — ręczny obrys fotografii</title>
<desc id="desc">Edytowalny wektor wykonany bezpośrednio według reliefu na fotografii IMG_1735.jpeg. Bez otoku i napisów. Zielony kolor jest umowny. Kontur głowy, palców i drobnych nacięć stanowi interpretację nieostrego reliefu; nie jest to skan geometryczny ani kopia 1:1. Nie dodano płomienia. Wszystkie widoczne elementy są ścieżkami wektorowymi; bez osadzonej bitmapy.</desc>
